<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flippin Stuff – snart här</title>
  <meta name="description" content="Flippin Stuff är en e-handelsplattform för kreatörer: egen butik, print on demand och allt som hör till. Öppnar snart.">
  <meta property="og:title" content="Flippin Stuff – snart här">
  <meta property="og:description" content="E-handel för kreatörer. Öppnar snart.">
  <meta property="og:image" content="https://flippinstuff.se/flippin-stuff-logo.jpg">
  <link rel="icon" href="data:,">
  <style>
    :root { --ground: #fbfaf6; --ink: #26292e; --muted: #6b6f76; --accent: #ee7b2a; }
    * { box-sizing: border-box; }
    html { height: 100%; } body { margin: 0; }
    body {
      background: var(--ground); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; min-width: 0; max-width: 560px; text-align: center; }
    img { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto 28px; }
    h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.1; margin: 0 0 14px; letter-spacing: -0.01em; }
    p { font-size: 17px; line-height: 1.55; margin: 0 auto; max-width: 44ch; color: var(--muted); }
    .mark { display: inline-block; width: 44px; height: 4px; background: var(--accent); border-radius: 2px; margin: 26px 0 0; }
    footer { margin-top: 44px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <img src="flippin-stuff-logo.jpg" alt="Flippin Stuff – e-commerce for creators" width="900" height="620">
    <h1>Snart här.</h1>
    <p>Flippin Stuff är en e-handelsplattform för kreatörer: egen butik, print on demand och allt som hör till. Vi öppnar dörrarna inom kort.</p>
    <span class="mark" aria-hidden="true"></span>
    <footer>© 2026 Flippin Stuff</footer>
  </main>
</body>
</html>
