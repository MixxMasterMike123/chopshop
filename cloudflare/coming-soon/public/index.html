<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flippin Stuff – snart här</title>
  <meta name="description" content="Flippin Stuff är en e-handelsplattform för kreatörer: egen butik, print on demand och allt som hör till. Öppnar snart.">
  <meta property="og:title" content="Flippin Stuff – snart här">
  <meta property="og:description" content="E-handel för kreatörer. Öppnar snart.">
  <meta property="og:image" content="https://flippinstuff.se/flippin-stuff-og.jpg">
  <link rel="icon" href="data:,">
  <style>
    :root { --ground: #fafafa; --ink: #26292e; --muted: #6b6f76; --accent: #ee7b2a; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root { --ground: #0f1114; --ink: #f2f2f0; --muted: #a3a7ad; }
    }
    * { box-sizing: border-box; }
    html { height: 100%; } body { margin: 0; }
    body {
      background: var(--ground); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; min-width: 0; max-width: 560px; text-align: center; }
    picture, img { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto; }
    picture { margin-bottom: 28px; }
    h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.1; margin: 0 0 14px; letter-spacing: -0.01em; }
    p { font-size: 17px; line-height: 1.55; margin: 0 auto; max-width: 44ch; color: var(--muted); }
    .mark { display: inline-block; width: 44px; height: 4px; background: var(--accent); border-radius: 2px; margin: 26px 0 0; }
    footer { margin-top: 44px; font-size: 13px; color: var(--muted); }
    footer a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
    footer a:hover { color: var(--ink); }
    footer span { margin: 0 8px; }
  </style>
</head>
<body>
  <main>
    <picture>
      <source srcset="flippin-stuff-logo-dark.webp" media="(prefers-color-scheme: dark)">
      <img src="flippin-stuff-logo-light.webp" alt="Flippin Stuff – e-commerce for creators" width="900" height="564">
    </picture>
    <h1>Snart här.</h1>
    <p>Flippin Stuff är en e-handelsplattform för kreatörer: egen butik, print on demand och allt som hör till. Vi öppnar dörrarna inom kort.</p>
    <span class="mark" aria-hidden="true"></span>
    <!-- The admin lives on staging until the cutover; this page is deleted then
         (see wrangler.jsonc), so the link never needs to change. -->
    <footer>© 2026 Flippin Stuff<span aria-hidden="true">·</span><a href="https://chopshop-admin-stg.kent-ee2.workers.dev/login" rel="nofollow">Logga in</a></footer>
  </main>
</body>
</html>
