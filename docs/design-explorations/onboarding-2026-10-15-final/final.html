<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>Kom igång – decided flow 2026-10-15</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* ---------- shared bits ---------- */
  .card { background: var(--a-surface); border-radius: 12px; box-shadow: var(--a-shadow), 0 0 0 1px #0000000a; overflow: hidden; }
  .drop { border-radius: 10px; background: var(--a-surface-2); box-shadow: 0 0 0 1px var(--a-border) inset; padding: 14px; display: flex; gap: 14px; align-items: center; }

  .drop b { display: block; font-size: 13.5px; }
  .drop span.m { color: var(--a-muted); font-size: 12px; }
  .drop .act { margin-left: auto; }
  .colors { display: flex; gap: 9px; align-items: center; }
  .sw { width: 28px; height: 28px; border-radius: 50%; box-shadow: 0 0 0 1px #0000001f inset; }
  .sw.sel { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--a-primary); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }

  .seg span { height: 28px; padding: 0 12px; display: flex; align-items: center; border-radius: 6px; color: var(--a-muted); font-weight: 500; }
  .seg span.on { background: #fff; color: var(--a-text); box-shadow: var(--a-shadow); }
  .check { display: flex; gap: 10px; align-items: flex-start; }
  .check .bx { width: 18px; height: 18px; border-radius: 5px; background: var(--a-primary); color: #fff; display: grid; place-items: center; flex: none; margin-top: 1px; }
  .check a { color: var(--a-text); text-decoration: underline; text-underline-offset: 2px; }
  .input .ok { margin-left: auto; }
  .input .pre { color: var(--a-faint); }
  .muted { color: var(--a-muted); }
  .tpl { border-radius: 10px; padding: 8px; box-shadow: 0 0 0 1px var(--a-border) inset; background: #fff; }
  .tpl.sel { box-shadow: 0 0 0 2px var(--a-primary) inset; }
  .tpl .ph { height: 96px; border-radius: 6px; overflow: hidden; position: relative; }

  .tpl span { color: var(--a-muted); font-size: 12px; }
  .stripe { font-weight: 700; color: #635bff; letter-spacing: -0.02em; }
  .secure { display: flex; align-items: center; gap: 6px; color: var(--a-muted); font-size: 12px; }
  .info { display: flex; gap: 10px; background: var(--a-info-bg); color: var(--a-info-text); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 18px; }
  .garments { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .g { border-radius: 10px; padding: 8px; box-shadow: 0 0 0 1px var(--a-border) inset; background: #fff; }
  .g.sel { box-shadow: 0 0 0 2px var(--a-primary) inset; }
  .g .ph { height: 78px; border-radius: 6px; background: var(--a-surface-2); display: grid; place-items: center; }
  .g b { display: block; margin-top: 6px; font-size: 13px; }
  .g span { color: var(--a-muted); font-size: 12px; }
  .money { font-size: 12px; color: var(--a-muted); }
  .money b { color: var(--a-ok-text); font-weight: 600; }

  .panel { background: var(--a-surface); border-right: 1px solid var(--a-border); display: flex; flex-direction: column; }

  .bars i.done { background: var(--a-ok-dot); } .bars i.now { background: var(--a-primary); }
  .stepmeta { display: flex; justify-content: space-between; padding: 10px 28px 0; color: var(--a-muted); font-size: 12px; }
  .content { padding: 28px 28px 0; flex: 1; }

  .s-hero.plain { background: radial-gradient(120% 90% at 85% 10%, color-mix(in srgb, var(--n-accent) 70%, #fff 0%) 0%, transparent 60%), color-mix(in srgb, var(--n-accent) 25%, #15121f); }
  .s-hero h2.hint, .s-hero p.hint { opacity: .55; }
  .store.nologo .s-logo svg { display: none; }

  .doc .tabs { display: flex; gap: 6px; margin-bottom: 22px; }
  .doc .tabs span { height: 28px; padding: 0 12px; border-radius: 999px; display: flex; align-items: center; font-size: 12.5px; color: #71757C; background: #F3F1EC; }
  .doc .tabs span.on { background: #1A1C1E; color: #fff; }
  .doc h2 { font: 700 26px 'Familjen Grotesk', sans-serif; letter-spacing: -0.02em; }
  .doc .upd { color: #71757C; font-size: 12.5px; margin-top: 4px; }
  .doc h4 { font: 700 15px 'Familjen Grotesk', sans-serif; margin: 20px 0 6px; }
  .doc p { font-size: 13.5px; line-height: 21px; color: #3b3e42; max-width: 66ch; }
  .doc mark { background: #fbeed3; color: #1A1C1E; border-radius: 4px; padding: 1px 4px; }

  /* money explainer */
  .moneycard { background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px #00000014, 0 24px 60px -24px #00000040; padding: 28px 30px; }
  .moneycard h3 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .moneycard .sub { color: var(--a-muted); margin-top: 4px; }
  .mline { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--a-border-soft); font-size: 15px; }
  .mline span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  .mline.total { border-bottom: 0; font-size: 18px; }
  .mline.total span:last-child { color: var(--a-ok-text); font-size: 22px; font-weight: 700; }
  .mprod { display: flex; gap: 14px; align-items: center; padding: 18px 0 8px; }
  .mprod .th { width: 56px; height: 56px; border-radius: 8px; background: #ECE9E2; display: grid; place-items: center; }
  .flowrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
  .flowrow div { background: var(--a-surface-2); border-radius: 10px; padding: 14px; }
  .flowrow b { display: block; font-size: 13px; margin-top: 8px; }
  .flowrow span { color: var(--a-muted); font-size: 12px; }

  /* summary list (A6) */
  .sum { display: flex; flex-direction: column; border-radius: 10px; box-shadow: 0 0 0 1px var(--a-border) inset; }
  .sum div { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--a-border-soft); }
  .sum div:first-child { border-top: 0; }
  .sum .ck { width: 20px; height: 20px; border-radius: 50%; background: var(--a-ok-dot); color: #fff; display: grid; place-items: center; flex: none; }
  .sum .v { margin-left: auto; color: var(--a-muted); }
  .sum a { color: var(--a-muted); text-decoration: underline; text-underline-offset: 2px; margin-left: 10px; font-size: 12px; }

  /* ---------- guide (B) ---------- */
  .shell { display: grid; grid-template-columns: 232px 1fr; height: calc(900px - 56px); }
  nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  nav a { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 6px; color: var(--a-text); font-weight: 500; }
  nav a.on { background: #00000014; }
  nav a .badge { margin-left: auto; background: #e3e3e3; border-radius: 6px; font-size: 11px; padding: 0 6px; color: #5a5a5a; }
  main { overflow: hidden; padding: 20px 28px; }
  .wrap { max-width: 1120px; display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 20px; align-items: start; }
  .pagehead { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; }
  .pagehead h1 { font-size: 20px; line-height: 28px; font-weight: 600; }
  .guide-head { padding: 18px 20px 16px; }
  .guide-head h2 { font-size: 16px; font-weight: 600; }
  .guide-head p { color: var(--a-muted); margin-top: 2px; }
  .prog { display: flex; align-items: center; gap: 12px; margin-top: 14px; color: var(--a-muted); font-size: 12px; }
  .bar { flex: 1; height: 6px; border-radius: 6px; background: var(--a-surface-3); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--a-primary); border-radius: 6px; }
  .step { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-top: 1px solid var(--a-border-soft); }
  .step .ck { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 1.5px #b5b5b5; }
  .step.done .ck { background: var(--a-primary); color: #fff; box-shadow: none; }
  .step .t { font-weight: 500; }
  .step.done .t { color: var(--a-muted); }
  .step .r { margin-left: auto; color: var(--a-faint); font-size: 12px; }
  .step.open { background: var(--a-surface-2); align-items: flex-start; padding: 16px 20px 18px; }
  .step.open .ck { box-shadow: inset 0 0 0 1.5px var(--a-primary); margin-top: 1px; }
  .ob { flex: 1; min-width: 0; }
  .ob > .t { font-size: 14px; font-weight: 600; }
  .ob > p { color: var(--a-muted); margin-top: 3px; max-width: 64ch; }
  .ob .embed { margin-top: 12px; background: #fff; border-radius: 10px; box-shadow: 0 0 0 1px var(--a-border); padding: 16px; }
  .ob .efoot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .mini { padding: 16px; }
  .mini h3 { font-size: 14px; font-weight: 600; }
  .thumb { margin-top: 12px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px var(--a-border); height: 230px; position: relative; }
  .thumb .store { transform: scale(0.4); transform-origin: top left; width: 250%; height: 250%; }
  .golive { margin-top: 14px; }
  .golive .btn { width: 100%; justify-content: center; height: 38px; font-size: 14px; }
  .btn[disabled] { background: #e3e3e3; color: #8a8a8a; box-shadow: none; }
  .missing { margin-top: 10px; font-size: 12px; color: var(--a-muted); display: flex; flex-direction: column; gap: 4px; }
  .missing span { display: flex; align-items: center; gap: 6px; }
  .missing i { width: 6px; height: 6px; border-radius: 50%; background: #b98900; }
  .missing.ok i { background: var(--a-ok-dot); }
  .helpc { padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
  .helpc .face { width: 36px; height: 36px; border-radius: 50%; background: #d9d4ea; display: grid; place-items: center; font-weight: 600; color: #3b2e66; flex: none; }
  .helpc b { display: block; }
  .helpc span { color: var(--a-muted); font-size: 12px; }
  .ready { display: flex; gap: 16px; align-items: center; margin-top: 12px; background: #fff; border-radius: 10px; box-shadow: 0 0 0 1px var(--a-border); padding: 16px; }

  /* ---------- start (S) ---------- */
  .mailwin { margin: 40px auto 0; width: 1080px; height: 780px; background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px #00000014, 0 30px 70px -30px #00000055; display: grid; grid-template-columns: 300px 1fr; overflow: hidden; }
  .inbox { background: #f7f7f7; border-right: 1px solid var(--a-border-soft); }
  .inbox .row { padding: 14px 16px; border-bottom: 1px solid var(--a-border-soft); }
  .inbox .row.on { background: #e8eef8; }
  .inbox .row b { display: block; }
  .inbox .row span { color: var(--a-muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail { padding: 26px 34px; overflow: hidden; }
  .mail .hdr { border-bottom: 1px solid var(--a-border-soft); padding-bottom: 16px; }
  .mail .hdr h2 { font-size: 20px; font-weight: 600; }
  .mail .hdr span { color: var(--a-muted); }
  .mbody { max-width: 520px; margin: 30px auto 0; font-size: 15px; line-height: 24px; color: #303030; }
  .mbody .logo { font-weight: 700; font-size: 18px; margin-bottom: 26px; }
  .mbody h3 { font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; }
  .mbody p { margin-bottom: 14px; }
  .mbody .cta { display: inline-flex; height: 44px; padding: 0 22px; background: #303030; color: #fff; border-radius: 8px; align-items: center; font-weight: 600; margin: 8px 0 22px; }
  .mbody .shopchip { display: flex; align-items: center; gap: 12px; background: #F3F1EC; border-radius: 10px; padding: 14px 16px; margin: 18px 0; }
  .mbody .small { color: var(--a-muted); font-size: 13px; }
  .auth { height: calc(900px - 56px); display: grid; place-items: center; }
  .auth .card { width: 440px; padding: 32px; }
  .auth h1 { font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .auth .lede { color: var(--a-muted); font-size: 14px; margin: 6px 0 24px; }
  .strength { display: flex; gap: 4px; margin-top: 8px; } .strength i { flex: 1; height: 4px; border-radius: 4px; background: var(--a-ok-dot); } .strength i.off { background: var(--a-border); }
  .auth .next { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--a-border-soft); color: var(--a-muted); font-size: 12.5px; }
  .auth .next ol { margin: 8px 0 0 18px; line-height: 22px; color: var(--a-text); }
</style>
<style>
  /* ---- additions for the decided flow (2026-10-15) ---- */

  .ro .tag { margin-left: auto; color: var(--a-faint); font-size: 12px; }
  .gates { display: flex; gap: 10px; background: var(--a-surface-2); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; line-height: 18px; color: var(--a-muted); box-shadow: 0 0 0 1px var(--a-border) inset; }
  .gates b { color: var(--a-text); font-weight: 600; }

  .type.sel { box-shadow: 0 0 0 2px var(--a-primary) inset; }

  .type b { display: block; font-size: 13.5px; }
  .type span { display: block; color: var(--a-muted); font-size: 12px; margin-top: 2px; }
  .type.off span, .type.off b { color: var(--a-faint); }
  .wait { display: flex; gap: 10px; align-items: flex-start; background: var(--a-info-bg); color: var(--a-info-text); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 18px; }
  .wait b { font-weight: 600; }
  .status { border-radius: 10px; padding: 16px; box-shadow: 0 0 0 1px var(--a-border) inset; display: flex; gap: 14px; align-items: flex-start; background: #fff; }
  .status .ic { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; flex: none; }

  .status p { color: var(--a-muted); margin-top: 2px; max-width: 48ch; }
  .status .act { margin-top: 12px; display: flex; gap: 8px; }
  .asks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-top: 4px; }
  .asks span { display: flex; gap: 8px; align-items: center; color: var(--a-muted); font-size: 12.5px; }
  .asks span svg { color: var(--a-faint); }
  .owners { display: flex; flex-direction: column; border-radius: 10px; box-shadow: 0 0 0 1px var(--a-border) inset; }

  .owners .who { margin-left: auto; }

  .owners .v { color: var(--a-muted); }
  .owners a { color: var(--a-muted); text-decoration: underline; text-underline-offset: 2px; font-size: 12px; margin-left: 2px; }
  .ck.wait { background: var(--a-caution-bg); color: var(--a-caution-text); box-shadow: none; padding: 0; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; }
  .ck.me { background: #fff; box-shadow: inset 0 0 0 1.5px var(--a-primary); width: 20px; height: 20px; border-radius: 50%; }
  .pill-caution { background: var(--a-caution-bg); color: var(--a-caution-text); } .pill-caution .dot { background: #c99a2e; }
  .mug { width: 150px; height: 150px; display: grid; place-items: center; }
  .s-card .flagwait { position: absolute; left: 8px; right: 8px; bottom: 76px; background: #1A1C1Ecc; color: #fff; font-size: 10.5px; font-weight: 500; padding: 4px 8px; border-radius: 6px; text-align: center; }
  .s-card.held { box-shadow: 0 0 0 2px var(--n-accent), 0 18px 40px -16px color-mix(in srgb, var(--n-accent) 55%, transparent); position: relative; }
  /* the open screen (dark, from c-live) */

  .open .lede { color: #ffffffa6; font-size: 15px; line-height: 23px; margin-top: 14px; max-width: 40ch; }
