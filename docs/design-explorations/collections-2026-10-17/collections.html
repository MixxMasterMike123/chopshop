<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><title>Samlingar – nested collections concept</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* ---------- admin shell (from the onboarding mocks) ---------- */
  .shell { display: grid; grid-template-columns: 232px 1fr; height: calc(900px - 56px); }
  nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  nav a { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 6px; color: var(--a-text); font-weight: 500; }
  nav a.on { background: #00000014; }
  main { overflow: hidden; padding: 20px 28px; }
  .card { background: var(--a-surface); border-radius: 12px; box-shadow: var(--a-shadow), 0 0 0 1px #0000000a; overflow: hidden; }
  .pagehead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .pagehead h1 { font-size: 20px; line-height: 28px; font-weight: 600; }
  .pagehead p { color: var(--a-muted); margin-top: 2px; }
  .wrap { max-width: 1120px; display: grid; grid-template-columns: minmax(0,1fr) 330px; gap: 20px; align-items: start; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .seg { display: inline-flex; background: #e6e6e6; border-radius: 8px; padding: 2px; }
  .seg span { height: 28px; padding: 0 12px; display: flex; align-items: center; border-radius: 6px; color: var(--a-muted); font-weight: 500; }
  .seg span.on { background: #fff; color: var(--a-text); box-shadow: var(--a-shadow); }
  .muted { color: var(--a-muted); }

  /* ---------- the tree (admin) ---------- */
  .tree { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 0; border-top: 1px solid var(--a-border-soft); position: relative; }
  .row:first-child { border-top: 0; }
  .row .grip { width: 28px; color: var(--a-faint); display: grid; place-items: center; cursor: grab; }
  .row .tog { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; color: var(--a-muted); }
  .row .tog.leaf { visibility: hidden; }
  .row .t { font-weight: 500; }
  .row .n { color: var(--a-faint); font-size: 12px; margin-left: 2px; }
  .row .kind { margin-left: 6px; }
  .row .sp { flex: 1; }
  .row .eye { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--a-text); }
  .row .eye.off { color: var(--a-faint); }
  .row .more { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--a-faint); }
  .row.d1 { padding-left: 28px; } .row.d2 { padding-left: 56px; } .row.d3 { padding-left: 84px; }
  .row.d1::before, .row.d2::before, .row.d3::before { content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: var(--a-border); }
  .row.d1::before { left: 28px; } .row.d2::before { left: 56px; } .row.d3::before { left: 84px; }
  .row.sel { background: var(--a-surface-2); }
  .row.ghost { background: #fff; box-shadow: 0 0 0 2px var(--a-primary) inset, var(--a-shadow-lift); border-radius: 8px; border-top: 0; }
  .row .addin { color: var(--a-muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .addrow { height: 40px; padding-left: 56px; color: var(--a-muted); border-top: 1px dashed var(--a-border); }
  .dropzone { height: 6px; margin: 0 14px 0 56px; border-radius: 3px; background: var(--a-primary); }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--a-border-soft); }
  .toolbar .search { flex: 1; max-width: 300px; }
  .legend { display: flex; gap: 14px; padding: 10px 14px; border-top: 1px solid var(--a-border-soft); color: var(--a-muted); font-size: 12px; }
  .legend span { display: flex; align-items: center; gap: 6px; }

  /* right rail: the visitor's menu, live */
  .rail h3 { font-size: 14px; font-weight: 600; }
  .rail p { color: var(--a-muted); margin-top: 2px; }
  .mini { padding: 16px; }
  .menuprev { margin-top: 12px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--a-border); background: var(--n-canvas); font-family: 'Instrument Sans', sans-serif; color: var(--n-ink); }
  .menuprev .bar { display: flex; gap: 12px; padding: 12px 14px; font-size: 12.5px; color: var(--n-muted); align-items: center; }
  .menuprev .bar b { color: var(--n-ink); font: 700 14px 'Familjen Grotesk', sans-serif; margin-right: 4px; }
  .menuprev .bar .on { color: var(--n-ink); font-weight: 600; border-bottom: 2px solid var(--n-accent); padding-bottom: 2px; }
  .menuprev .panel { background: #fff; margin: 0 10px 10px; border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; font-size: 12.5px; }
  .menuprev .panel span { padding: 3px 0; }
  .menuprev .panel span.h { font-weight: 600; grid-column: 1 / -1; margin-top: 4px; }
  .menuprev .panel span.sub { color: var(--n-muted); padding-left: 10px; }

  /* ---------- edit page ---------- */
  .parentpick { display: flex; flex-direction: column; border-radius: 8px; box-shadow: 0 0 0 1px var(--a-border) inset; max-height: 230px; overflow: hidden; }
  .parentpick div { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .parentpick div.d1 { padding-left: 30px; } .parentpick div.d2 { padding-left: 48px; }
  .parentpick div.on { background: var(--a-surface-2); font-weight: 600; }
  .parentpick div.dim { color: var(--a-faint); }
  .check { display: flex; gap: 10px; align-items: flex-start; }
  .check .bx { width: 18px; height: 18px; border-radius: 5px; background: var(--a-primary); color: #fff; display: grid; place-items: center; flex: none; margin-top: 1px; }
  .check .bx.off { background: #fff; box-shadow: inset 0 0 0 1.5px #b5b5b5; }
  .crumb { color: var(--a-muted); font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
  .crumb b { color: var(--a-text); font-weight: 500; }
  .prodlist { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .prod { border-radius: 8px; box-shadow: 0 0 0 1px var(--a-border) inset; padding: 8px; }
  .prod .ph { height: 70px; border-radius: 6px; background: var(--a-surface-2); display: grid; place-items: center; }
  .prod b { display: block; margin-top: 6px; font-size: 12.5px; }
  .prod span { color: var(--a-muted); font-size: 12px; }

  /* ---------- storefront (NORD) ---------- */
  .sf { height: 844px; background: var(--n-canvas); font-family: 'Instrument Sans', sans-serif; color: var(--n-ink); --n-accent: #1F3A5F; }
  .sf .nav { display: flex; align-items: center; gap: 18px; padding: 18px 48px; }
  .sf .logo { font: 700 22px 'Familjen Grotesk', sans-serif; letter-spacing: -0.02em; margin-right: 10px; }
  .sf .links { display: flex; gap: 6px; }
  .sf .links span { height: 34px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; color: var(--n-muted); font-size: 15px; }
  .sf .links span.on { background: #fff; color: var(--n-ink); font-weight: 600; box-shadow: 0 1px 2px #1A1C1E08, 0 8px 24px -12px #1A1C1E1F; }
  .sf .cart { margin-left: auto; background: var(--n-ink); color: #fff; border-radius: 999px; height: 38px; padding: 0 16px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
  .sf .cart b { background: var(--n-accent); border-radius: 999px; min-width: 20px; height: 20px; display: grid; place-items: center; font-size: 12px; }
  .mega { margin: 0 48px; background: #fff; border-radius: 22px; box-shadow: 0 2px 4px #1A1C1E0A, 0 20px 44px -16px #1A1C1E2E; padding: 26px 30px; display: grid; grid-template-columns: repeat(4, 1fr) 1.2fr; gap: 24px; }
  .mega h4 { font: 700 15px 'Familjen Grotesk', sans-serif; margin-bottom: 8px; }
  .mega ul { list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #3b3e42; }
  .mega li.all { color: var(--n-muted); font-size: 13px; margin-top: 6px; }
  .mega .feat { border-radius: 16px; overflow: hidden; background: #1d1730; color: #fff; padding: 18px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 200px; background-image: radial-gradient(120% 90% at 85% 10%, color-mix(in srgb, var(--n-accent) 75%, #fff 0%) 0%, transparent 60%); }
  .mega .feat b { font: 700 20px 'Familjen Grotesk', sans-serif; letter-spacing: -0.02em; }
  .mega .feat span { color: #ffffffbf; font-size: 13px; margin-top: 4px; }
  .page { padding: 10px 48px; }
  .crumbs { display: flex; gap: 8px; color: var(--n-muted); font-size: 13.5px; align-items: center; }
  .crumbs b { color: var(--n-ink); font-weight: 500; }
  .page h1 { font: 700 42px/1.04 'Familjen Grotesk', sans-serif; letter-spacing: -0.022em; margin-top: 14px; }
  .page .count { color: var(--n-muted); margin-top: 6px; font-size: 14px; }
  .chips { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .chips span { height: 36px; padding: 0 14px; border-radius: 999px; background: #fff; display: flex; align-items: center; gap: 8px; font-size: 14px; box-shadow: 0 1px 2px #1A1C1E08, 0 8px 24px -12px #1A1C1E1F; }
  .chips span.on { background: var(--n-ink); color: #fff; }
  .chips span.all { background: transparent; box-shadow: 0 0 0 1px #1A1C1E1A inset; }
  .chips span i { color: var(--n-muted); font-style: normal; font-size: 12px; }
  .chips span.on i { color: #ffffffa6; }
  .pgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-top: 22px; }
  .pc { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px #1A1C1E08, 0 8px 24px -12px #1A1C1E1F; }
  .pc .img { aspect-ratio: 1; display: grid; place-items: center; }
  .pc .body { padding: 8px 10px 10px; }
  .pc .t { font: 700 13px 'Familjen Grotesk', sans-serif; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc .a { color: var(--n-muted); font-size: 12px; }
  .pc .p { font: 700 13px 'Familjen Grotesk', sans-serif; margin-top: 4px; }
  .dense { display: flex; gap: 6px; margin-left: auto; align-items: center; color: var(--n-muted); font-size: 12.5px; }
  .dense i { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: #fff; }
  .dense i.on { background: var(--n-ink); color: #fff; }
  .toprow { display: flex; align-items: flex-end; }

  /* phone */
  .phonewrap { height: 844px; background: #e9e9e9; display: grid; place-items: center; grid-template-columns: 1fr 1fr; }
  .phone { width: 360px; height: 740px; border-radius: 36px; background: var(--n-canvas); box-shadow: 0 0 0 10px #1a1a1a, 0 30px 60px -20px #0008; overflow: hidden; font-family: 'Instrument Sans', sans-serif; color: var(--n-ink); --n-accent: #1F3A5F; position: relative; }
  .phone .pn { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 10px; }
  .phone .pn b { font: 700 19px 'Familjen Grotesk', sans-serif; }
  .phone .burger { width: 36px; height: 36px; border-radius: 999px; background: #fff; display: grid; place-items: center; }
  .sheet { position: absolute; inset: 64px 0 0; background: #fff; border-radius: 28px 28px 0 0; padding: 18px 20px; box-shadow: 0 -10px 40px -20px #0004; }
  .sheet .r { display: flex; align-items: center; height: 46px; font-size: 16px; font-weight: 500; border-top: 1px solid #1A1C1E0F; }
  .sheet .r:first-child { border-top: 0; }
  .sheet .r.open { font-weight: 700; }
  .sheet .r .chev { margin-left: auto; color: var(--n-muted); }
  .sheet .r.c1 { padding-left: 16px; font-weight: 400; font-size: 15px; }
  .sheet .r.c1.on { font-weight: 600; color: var(--n-accent); }
  .sheet .r.c2 { padding-left: 32px; font-weight: 400; font-size: 14.5px; color: #3b3e42; }
  .sheet .r .n { margin-left: 8px; color: var(--n-muted); font-size: 12px; font-weight: 400; }
  .phone .pchips { display: flex; gap: 8px; padding: 6px 18px 0; overflow: hidden; }
  .phone .pchips span { height: 32px; padding: 0 12px; border-radius: 999px; background: #fff; display: flex; align-items: center; font-size: 13px; white-space: nowrap; box-shadow: 0 1px 2px #1A1C1E08, 0 8px 24px -12px #1A1C1E1F; }
  .phone .pchips span.on { background: var(--n-ink); color: #fff; }
  .phone .pcr { padding: 10px 18px 0; color: var(--n-muted); font-size: 12px; }
  .phone h2 { font: 700 26px 'Familjen Grotesk', sans-serif; letter-spacing: -0.02em; padding: 6px 18px 0; }
  .phone .pg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 18px; }
  .phone .pc .img { aspect-ratio: 1; }

  /* ---------- product form: the collection picker ---------- */
  .pform { max-width: 1120px; display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 20px; align-items: start; }
  .chipsel { display: flex; flex-wrap: wrap; gap: 6px; }
  .chipsel span { height: 28px; padding: 0 6px 0 10px; border-radius: 6px; background: var(--a-surface-2); box-shadow: 0 0 0 1px var(--a-border) inset; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .chipsel span .path { color: var(--a-faint); }
  .chipsel span .x { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; color: var(--a-faint); }
  .chipsel span.auto { background: var(--a-info-bg); color: var(--a-info-text); box-shadow: none; }
  .picker { border-radius: 8px; box-shadow: 0 0 0 1px var(--a-border) inset; overflow: hidden; }
  .picker .srch { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-bottom: 1px solid var(--a-border-soft); font-size: 13.5px; }
  .picker .srch .q { font-weight: 500; }
  .picker .r { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; }
  .picker .r.d1 { padding-left: 30px; } .picker .r.d2 { padding-left: 48px; } .picker .r.d3 { padding-left: 66px; }
  .picker .r .cb { width: 16px; height: 16px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px #b5b5b5; display: grid; place-items: center; flex: none; }
  .picker .r .cb.on { background: var(--a-primary); box-shadow: none; color: #fff; }
  .picker .r .cb.half { background: #fff; box-shadow: inset 0 0 0 1.5px var(--a-primary); }
  .picker .r .cb.half::after { content: ""; width: 8px; height: 2px; background: var(--a-primary); }
  .picker .r .n { color: var(--a-faint); font-size: 12px; }
  .picker .r .tg { width: 16px; color: var(--a-muted); display: grid; place-items: center; }
  .picker .r.dim { color: var(--a-faint); }
  .picker .r.hit b { background: #fbeed3; border-radius: 2px; padding: 0; font-weight: 500; }
  .picker .r.newrow { color: var(--a-muted); border-top: 1px dashed var(--a-border); }
  .picker .r.newrow .input { height: 28px; font-size: 13px; flex: 1; max-width: 260px; }
  .picker .foot { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-top: 1px solid var(--a-border-soft); color: var(--a-muted); font-size: 12px; }
  .bulk { display: flex; align-items: center; gap: 10px; background: var(--a-topbar); color: #fff; border-radius: 10px; padding: 10px 14px; box-shadow: var(--a-shadow-lift); }
  .bulk b { font-weight: 600; }
  .bulk .btn { height: 28px; }

  /* ---------- the simple stages ---------- */
  .empty { padding: 44px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .empty h2 { font-size: 16px; font-weight: 600; }
  .empty p { color: var(--a-muted); max-width: 44ch; }
  .empty .ex { display: flex; gap: 8px; margin-top: 6px; }
  .empty .ex span { height: 30px; padding: 0 12px; border-radius: 999px; background: var(--a-surface-2); display: flex; align-items: center; color: var(--a-muted); box-shadow: 0 0 0 1px var(--a-border) inset; }
  .flatrow { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; border-top: 1px solid var(--a-border-soft); }
  .flatrow:first-child { border-top: 0; }
  .flatrow .th { display: flex; }
  .flatrow .th i { width: 26px; height: 26px; border-radius: 6px; background: var(--a-surface-2); box-shadow: 0 0 0 2px #fff; margin-left: -8px; display: grid; place-items: center; }
  .flatrow .th i:first-child { margin-left: 0; }
  .flatrow .t { font-weight: 500; }
  .flatrow .n { color: var(--a-faint); font-size: 12px; }
  .flatrow .sp { flex: 1; }
  .hint { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; background: var(--a-surface-2); color: var(--a-muted); font-size: 12.5px; line-height: 18px; border-top: 1px solid var(--a-border-soft); }
  .artnav .links span.on { background: #fff; }
  .artist { --n-accent: #8A4B2B; }
  .arthero { margin: 10px 48px 0; border-radius: 22px; padding: 30px 40px; color: #fff; background: radial-gradient(120% 90% at 85% 10%, color-mix(in srgb, var(--n-accent) 75%, #fff 0%) 0%, transparent 60%), #1d1510; }
  .arthero h1 { font: 700 36px/1.04 'Familjen Grotesk', sans-serif; letter-spacing: -0.022em; max-width: 14ch; }
  .arthero p { color: #ffffffbf; margin-top: 12px; max-width: 40ch; font-size: 15px; }
  .artgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 16px 48px; }
  .art { aspect-ratio: 5/4 !important; }

  .mrow { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; border-top: 1px solid var(--a-border-soft); }
  .mrow:first-child { border-top: 0; }
  .mrow .kind { height: 28px; padding: 0 10px; border-radius: 6px; background: var(--a-surface-2); box-shadow: 0 0 0 1px var(--a-border) inset; display: inline-flex; align-items: center; gap: 6px; color: var(--a-muted); font-size: 12.5px; min-width: 96px; }
  .mrow .lbl { font-weight: 500; }
  .mrow .sp { flex: 1; }
  .mblock { border-top: 1px solid var(--a-border-soft); background: var(--a-surface-2); padding: 12px 16px 14px; }
  .mblock .head { display: flex; align-items: center; gap: 12px; }
  .mblock .head .kind { background: #fff; }
  .mblock .inner { margin: 10px 0 0 40px; background: #fff; border-radius: 8px; box-shadow: 0 0 0 1px var(--a-border) inset; padding: 6px 0; }
  .mblock .inner .r { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 13px; color: var(--a-muted); }
  .mblock .inner .r.d0 { color: var(--a-text); font-weight: 500; }
  .mblock .inner .r.d1 { padding-left: 30px; } .mblock .inner .r.d2 { padding-left: 48px; font-size: 12.5px; }
  .mblock .foot { display: flex; align-items: center; gap: 14px; margin: 10px 0 0 40px; color: var(--a-muted); font-size: 12.5px; }
  .mblock .foot a { color: var(--a-text); text-decoration: underline; text-underline-offset: 2px; }
</style></head>

  <symbol id="vinyl" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="#1b1b1f"/><circle cx="60" cy="60" r="44" fill="none" stroke="#2c2c33" stroke-width="2"/><circle cx="60" cy="60" r="34" fill="none" stroke="#2c2c33" stroke-width="2"/><circle cx="60" cy="60" r="18" fill="currentColor"/><circle cx="60" cy="60" r="3" fill="#1b1b1f"/></symbol>
  <symbol id="cd" viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="#dfe3ea"/><circle cx="60" cy="60" r="46" fill="none" stroke="#fff" stroke-width="3"/><circle cx="60" cy="60" r="14" fill="#fff" stroke="#c9cfd8" stroke-width="2"/><path d="M26 38 A40 40 0 0 1 60 14" fill="none" stroke="#fff" stroke-width="8" opacity=".8"/></symbol>
  <symbol id="tee" viewBox="0 0 120 120"><path d="M42 14 L24 20 L8 38 L20 50 L30 42 L30 108 L90 108 L90 42 L100 50 L112 38 L96 20 L78 14 C74 22 67 26 60 26 C53 26 46 22 42 14 Z" fill="currentColor"/></symbol>
  <symbol id="chev" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="chevd" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
